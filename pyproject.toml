[project]
name = "mir4_auto_farm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ruan-ds", email = "ruantmelon@icloud.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pyside6>=6.11.1",
    "pywin32>=312; sys_platform == 'win32'",
]

[project.scripts]
mir4_auto_farm = "mir4_auto_farm.main:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
    "pyinstaller>=6.22.2",
]
